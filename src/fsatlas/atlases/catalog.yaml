# fsatlas built-in atlas catalog
# Each atlas entry defines how to identify and locate atlas files.
#
# Fields:
#   name:             Short identifier used in CLI (e.g., schaefer100-7)
#   description:      Human-readable description
#   type:             "surface" (.annot in fsaverage) or "volumetric" (NIfTI in MNI)
#   format:           File format: "annot", "nifti", "dlabel_gii", "gca"
#   space:            Source space (fsaverage, MNI152NLin6Asym, MNI152NLin2009cAsym)
#   bids_name:        BIDS atlas entity value used in filenames and directory names
#   citation:         Short citation string
#   family:           Grouping key for related atlases (e.g., "schaefer2018")
#   builtin:          True for FreeSurfer built-in atlases (no download needed)
#   annot_name:       FreeSurfer annot stem for built-in surface atlases
#
# Build-time-only fields (used by scripts/build_bids_atlases.py / fsatlas populate):
#   source_url:       Where to download the atlas files
#   files:            Dict of files to acquire (key = logical name, value = remote filename)
#   labels_tsv:       Source filename for the LUT
#   dseg_tsv:         Rich BIDS-style dseg.tsv (preferred over auto-generated LUT)
#   local_source_dir: Local directory to copy files from (priority over source_url)

